name: Build, Test & Publish to NuGet.org

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore TreeSitter.CodeGraph.slnx

      - name: Build Solution (Release)
        run: dotnet build TreeSitter.CodeGraph.slnx -c Release --no-restore

      - name: Run Unit Tests
        run: dotnet test TreeSitter.CodeGraph.slnx -c Release --no-build --verbosity normal

      - name: Extract Tag Version
        if: startsWith(github.ref, 'refs/tags/v')
        id: get_version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Packing package version: $VERSION"

      - name: Pack NuGet Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          dotnet pack src/TreeSitter.CodeGraph.csproj \
            -c Release \
            -p:PackageVersion=${{ steps.get_version.outputs.VERSION }} \
            -p:Version=${{ steps.get_version.outputs.VERSION }} \
            -o ./nupkg

      - name: Login to NuGet via Trusted Publishing (OIDC)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: Jianyao17

      - name: Publish Package to NuGet.org
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
