name: Build, Test & Publish to GitHub Packages

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore TreeSitter.CodeGraph.sln

      - name: Build Solution
        run: dotnet build TreeSitter.CodeGraph.sln -c Release --no-restore

      - name: Run Tests
        run: dotnet test TreeSitter.CodeGraph.sln -c Release --no-build --verbosity normal

      - name: Extract Tag Version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building package version: $VERSION"

      - name: Pack NuGet Package with Tag Version
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet pack src/TreeSitter.CodeGraph.csproj -c Release -p:PackageVersion=${{ env.VERSION }} -p:Version=${{ env.VERSION }} -o ./nupkg

      - name: Publish Package to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          dotnet nuget add source --name github --username "${{ github.repository_owner }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" || true
          dotnet nuget push ./nupkg/*.nupkg --source "github" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate
